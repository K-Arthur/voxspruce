name: Bug report
description: Report a reproducible problem without sharing private data.
title: "Bug: "
body:
  - type: markdown
    attributes:
      value: "Do not post transcripts, recordings, tokens, private paths or device identifiers. For vulnerabilities use [private reporting](https://github.com/K-Arthur/voxspruce/security/advisories/new)."
  - type: textarea
    id: problem
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use synthetic example text and a disposable destination.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Distribution/version, desktop/version, Wayland or X11, Python, and project commit if known.
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized details
      description: Describe Practice or Live mode, permission state, and relevant errors without personal data.
