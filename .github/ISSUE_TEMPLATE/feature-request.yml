name: Feature request
description: Describe a problem or improvement.
title: "Feature: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Share your use case without personal or sensitive information.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or constraints
