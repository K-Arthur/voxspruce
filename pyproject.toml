[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wayland-voice-control"
version = "0.1.0"
description = "Offline, explicitly confirmed voice assistance for GNOME Wayland"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
wayland-voice-control = "wayland_voice_control.__main__:main"

[project.optional-dependencies]
speech = ["vosk>=0.3.45,<0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wayland_voice_control = ["schema.sql"]
