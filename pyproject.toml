[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wayland-voice-control"
version = "0.1.0"
description = "Voxspruce: experimental offline Linux voice input with explicit review, accessibility and privacy goals"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["wayland", "linux", "voice-control", "dictation", "accessibility", "privacy", "offline"]
classifiers = ["Development Status :: 3 - Alpha", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3"]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/K-Arthur/voxspruce"
Documentation = "https://github.com/K-Arthur/voxspruce#readme"
Issues = "https://github.com/K-Arthur/voxspruce/issues"

[project.scripts]
wayland-voice-control = "wayland_voice_control.__main__:main"

[project.optional-dependencies]
speech = ["vosk>=0.3.45,<0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wayland_voice_control = ["schema.sql", "custom-shortcuts.sql", "resources/icons/*.svg"]

[tool.setuptools.data-files]
"share/applications" = ["data/io.github.wayland_voice_control.desktop"]
"share/icons/hicolor/scalable/apps" = ["data/io.github.wayland_voice_control.svg"]
"share/wayland-voice-control/schemas" = ["schemas/settings.schema.json", "schemas/custom-voice-shortcuts.schema.json"]
"share/dbus-1/services" = ["data/io.github.wayland_voice_control.service"]
"share/wayland-voice-control/plasma/io.github.wayland_voice_control" = ["integrations/plasma/io.github.wayland_voice_control/metadata.json"]
"share/wayland-voice-control/plasma/io.github.wayland_voice_control/contents/ui" = ["integrations/plasma/io.github.wayland_voice_control/contents/ui/*.qml"]
